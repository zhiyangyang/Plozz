name: Plozz
options:
  bundleIdPrefix: com.thatcube
  # English is the source language for App/Resources/Localizable.xcstrings.
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: N8Z5T4AK3X
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "3" # Apple TV
    SWIFT_STRICT_CONCURRENCY: complete
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    # Build number (CFBundleVersion) fallback. tools/generate-project.sh bakes the
    # real value into the generated project on every regenerate — from the git
    # commit count (local/device/simulator builds) or PLOZZ_BUILD_NUMBER (the
    # fastlane `build` lane passes latest TestFlight build + 1). This literal only
    # survives if the project is generated with a bare `xcodegen generate`.
    CURRENT_PROJECT_VERSION: 1
    # Marketing version (CFBundleShortVersionString) fallback. Defined once here so
    # the app and Top Shelf extension share the same value (the extension's
    # CFBundleShortVersionString must match the parent app's). tools/generate-project.sh
    # reads the stable Apple version from the release catalog, or an explicitly
    # validated PLOZZ_MARKETING_VERSION override. Never derive it from today's date.
    MARKETING_VERSION: "0.1"
    # Release channel this binary was built for ("testflight" / "production").
    # Empty for local/device builds, which fall back to runtime detection.
    # tools/generate-project.sh bakes the PLOZZ_RELEASE_CHANNEL env var here; the
    # fastlane `beta` and `release` lanes set it. This exists because the runtime
    # fallback sniffs `Bundle.main.appStoreReceiptURL`, which can be nil
    # (a receipt is only written after a purchase) — so a TestFlight build could
    # read as production and silently default crash reporting OFF.
    PLOZZ_RELEASE_CHANNEL: ""
    # Stable id of the release-notes catalog entry shipped in a TestFlight/App
    # Store binary. Local builds leave it empty and never show update notes.
    PLOZZ_RELEASE_ID: ""
    # Display-only date/revision version from the selected catalog entry.
    # Empty for local builds; never written to CFBundleShortVersionString.
    PLOZZ_RELEASE_VERSION: ""
    PLOZZ_DEV_FEATURE_LABEL: ""
  configs:
    Debug:
      PLOZZ_DEV_FEATURE: "$(PLOZZ_DEV_FEATURE_LABEL)"
    Release:
      PLOZZ_DEV_FEATURE: ""

# Local Swift package providing all modular feature/code libraries.
packages:
  Plozz:
    path: .

targets:
  PlozziOS:
    type: application
    platform: iOS
    postBuildScripts:
      - name: Embed disc runtime
        script: python3 "$SRCROOT/tools/embed-disc-runtime.py"
        basedOnDependencyAnalysis: false
    deploymentTarget: "18.0"
    sources:
      - path: App/PlozziOS
      - path: App/Privacy/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/CommunityAssets.xcassets
      - path: App/Resources/Fonts
      # The single app-owned String Catalog shared by the app targets.
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/ReleaseNotes.json
      - path: App/Resources/LibassNotices.txt
      - path: App/Resources/LibblurayNotices.txt
      - path: App/Resources/LibTrueHDNotices.txt
      - path: App/Resources/LibTrueHDLicense.txt
      - path: App/Resources/LibTrueHDApacheLicense.txt
    info:
      path: App/PlozziOS/Info.plist
      properties:
        CFBundleDisplayName: Plozz Custom${PLOZZ_NAME_SUFFIX}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        PlozzReleaseChannel: "$(PLOZZ_RELEASE_CHANNEL)"
        PlozzReleaseID: "$(PLOZZ_RELEASE_ID)"
        PlozzReleaseVersion: "$(PLOZZ_RELEASE_VERSION)"
        PlozzDevelopmentFeature: "$(PLOZZ_DEV_FEATURE)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).downloads.*"
          - "$(PRODUCT_BUNDLE_IDENTIFIER).external-stream.*"
        UIBackgroundModes:
          # `audio` keeps playback running once the app leaves the foreground,
          # which is what both Picture in Picture and AirPlay need.
          - audio
          - processing
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - "Bungee-Regular.ttf"
          - "AtkinsonHyperlegible-Regular.ttf"
          - "AtkinsonHyperlegible-Italic.ttf"
          - "AtkinsonHyperlegible-Bold.ttf"
          - "AtkinsonHyperlegible-BoldItalic.ttf"
          - "Lexend-Regular.ttf"
          - "Lexend-Medium.ttf"
          - "Lexend-SemiBold.ttf"
          - "Lexend-Bold.ttf"
          - "Roboto-Regular.ttf"
          - "Roboto-Medium.ttf"
          - "Roboto-SemiBold.ttf"
          - "Roboto-Italic.ttf"
          - "Roboto-Bold.ttf"
          - "Roboto-BoldItalic.ttf"
          - "Fredoka-Regular.ttf"
          - "Fredoka-Medium.ttf"
          - "Fredoka-SemiBold.ttf"
          - "Fredoka-Bold.ttf"
          - "OpenDyslexic-Regular.otf"
          - "OpenDyslexic-Italic.otf"
          - "OpenDyslexic-Bold.otf"
          - "OpenDyslexic-BoldItalic.otf"
        NSLocalNetworkUsageDescription: "Plozz uses your local network to discover media servers and network shares."
        NSMotionUsageDescription: "Plozz uses device motion to follow your phone's landscape direction during playback."
        NSBonjourServices:
          - _jellyfin._tcp
          - _smb._tcp
        NSCameraUsageDescription: "Plozz uses the camera to scan the setup code shown on your other device."
        OMDBAPIKey: "$(OMDB_API_KEY)"
        TMDBBearerToken: "$(TMDB_BEARER_TOKEN)"
        TMDBProxyBaseURL: "$(TMDB_PROXY_BASE_URL)"
        # TheTVDB v4 API key. TheTVDB
        # is the only bundled provider that covers MOVIES (the keyless sources are
        # anime- or TV-only, leaving Wikidata/Wikipedia as a patchy fallback), so
        # omitting it here silently disabled movie posters on iPhone and iPad while
        # the Apple TV looked fine — roughly half of a mainstream library rendered
        # blank with no error anywhere.
        TVDBAPIKey: "$(TVDB_API_KEY)"
        LastFmAPIKey: "$(LASTFM_API_KEY)"
        LastFmSharedSecret: "$(LASTFM_SHARED_SECRET)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.zhiyangyang.plozz.deeplink
            CFBundleURLSchemes:
              - plozzcustom
              - "$(PRODUCT_BUNDLE_IDENTIFIER).external-player"
        LSApplicationQueriesSchemes:
          - infuse
          - vlc-x-callback
        TraktClientID: "$(TRAKT_CLIENT_ID)"
        WetrakrClientID: "$(WETRAKR_CLIENT_ID)"
        SimklClientID: "$(SIMKL_CLIENT_ID)"
        AniListClientID: "$(ANILIST_CLIENT_ID)"
        AniListClientSecret: "$(ANILIST_CLIENT_SECRET)"
        MALClientID: "$(MAL_CLIENT_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zhiyangyang.plozz${PLOZZ_ID_SUFFIX}
        PRODUCT_NAME: Plozz
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # This personal build deliberately has no iCloud, push, or associated
        # domains. The empty branded entitlements keep those capabilities off.
        CODE_SIGN_ENTITLEMENTS: App/PlozziOS/PlozziOS.branded.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: Plozz
        product: AppShelliOS
      - package: Plozz
        product: FeaturePlayback
      - package: Plozz
        product: EnginePlozzigen

  PlozziOSPresentationHost:
    type: application
    platform: iOS
    postBuildScripts:
      - name: Embed disc runtime
        script: python3 "$SRCROOT/tools/embed-disc-runtime.py"
        basedOnDependencyAnalysis: false
    sources:
      - path: Tests/iOSPresentationHost
      - path: Tests/HomePresentationSupport/DetailSelectionFixture.swift
      - path: Tests/HomePresentationSupport/ContentRefreshReturnFixture.swift
      - path: Tests/AuthPresentationSupport/MobileServerOnboardingFixture.swift
      - path: Tests/AuthPresentationSupport/OnboardingPreviewHTTP.swift
      - path: Tests/PlaybackPresentationSupport/PlaybackFailureFixture.swift
      - path: Tests/PlaybackPresentationSupport/DiscReviewFixture.swift
      - path: Tests/PlaybackPresentationSupport/LocalTestHTTPServer.swift
      - path: Tests/SubtitlePresentationSupport/Fixtures/four-three.mp4
        buildPhase: resources
        buildPhase: resources
        buildPhase: resources
      - path: App/Resources/Localizable.xcstrings
      - path: Tests/AuthPresentationSupport/ServerAddressNavigationFixture.swift
      - path: Tests/AuthPresentationSupport/PlexHomeOnboardingFixture.swift
      - path: App/PlozziOS/Assets.xcassets
      - path: App/Resources/CommunityAssets.xcassets
      - path: App/Resources/ReleaseNotes.json
    info:
      path: Tests/iOSPresentationHost/Info.plist
      properties:
        NSMotionUsageDescription: "Plozz uses device motion to follow your phone's landscape direction during playback."
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).downloads.*"
          - "$(PRODUCT_BUNDLE_IDENTIFIER).external-stream.*"
        UIBackgroundModes:
          - audio
          - processing
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Plozz.PresentationHost
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: Plozz
        product: AppShelliOS

  PlozziOSPresentationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOSPresentationTests
      - path: Tests/FocusIntegrationTests/ContentRefreshSurfaceHostedTests.swift
      - path: Tests/PlaybackPresentationSupport/PlayerContinueWatchingPresentationTests.swift
      - path: Tests/PlaybackPresentationSupport/LocalTestHTTPServer.swift
      - path: Tests/CoreModelsTests/ContinueWatchingInPlayerSettingsTests.swift
      - path: Tests/FeaturePlaybackTests/ContinueWatchingSelectionTests.swift
      - path: Tests/CoreUITests/DetailInformationPreviewTests.swift
      - path: Tests/CoreUITests/AmbientGradientTests.swift
      - path: Tests/CoreUITests/DetailHeaderMetadataRowTests.swift
      - path: Tests/EnginePlozzigenTests/SpatialAudioLayoutPreferenceTests.swift
      - path: Tests/FeaturePlaybackTests/NativePlaybackLifecycleTests.swift
      - path: Tests/FeaturePlaybackTests/PlayerVideoZoomTests.swift
      - path: Tests/FeaturePlaybackTests/PlayerViewModelEOFTests.swift
      - path: Tests/FeaturePlaybackTests/VideoNowPlayingCoordinatorTests.swift
      - path: Tests/FeaturePlaybackTests/SystemPlaybackAudioTests.swift
      - path: Tests/FeaturePlaybackTests/SeriesTrackMemoryTests.swift
      - path: Tests/FeaturePlaybackTests/StreamingPlaybackTests.swift
      - path: Tests/FeaturePlaybackTests/SubtitleTrackControllerTests.swift
      - path: Tests/CoreModelsTests/SeriesTrackPreferenceStoreTests.swift
      - path: Tests/CoreModelsTests/SettingsHydrationTests.swift
      - path: Tests/CoreModelsTests/DiscPlaybackTests.swift
      - path: Tests/CoreModelsTests/PlaybackOrientationSettingsTests.swift
      - path: Tests/CoreModelsTests/ResumeRewindSettingsTests.swift
      - path: Tests/CoreModelsTests/SubtitleStylePreferencesTests.swift
      - path: Tests/CoreModelsTests/SettingsSearchTests.swift
      - path: Tests/FeaturePlaybackTests/SubtitleOverlayGeometryTests.swift
      - path: Tests/FocusIntegrationTests/DiagnosticRecordingStatusHostedTests.swift
      - path: Tests/FocusIntegrationTests/PINRequirementPresentationTests.swift
      - path: Tests/HomePresentationSupport
        excludes: ["ContentRefreshReturnFixture.swift", "ContentRefreshReturnInteractionTests.swift", "DetailSelectionFixture.swift", "DetailSelectionInteractionTests.swift"]
      - path: Tests/TestSupportPerformance
      - path: Tests/PerformancePresentationSupport
      - path: Tests/AppearancePresentationSupport
      - path: Tests/CoreUITests/DialogSurfaceTests.swift
      - path: Tests/AuthPresentationSupport
      - path: Tests/SubtitlePresentationSupport
        excludes: ["Fixtures"]
      - path: Tests/SubtitlePresentationSupport/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Plozz.PresentationTests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Spatial layout tests call the dynamic engine directly, not only through the app umbrella.
        OTHER_LDFLAGS: "$(inherited) -framework AetherEngine"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PlozziOSPresentationHost.app/PlozziOSPresentationHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: PlozziOSPresentationHost
      - package: Plozz
        product: AppShelliOS
        link: false

  PlozziOSInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/iOSInteractionTests
      - path: Tests/HomePresentationSupport/DetailSelectionInteractionTests.swift
      - path: Tests/HomePresentationSupport/ContentRefreshReturnInteractionTests.swift
      - path: Tests/PlaybackPresentationSupport/PlaybackFailureInteractionTests.swift
      - path: Tests/PlaybackPresentationSupport/DiscReviewScreenshotTests.swift
      - path: Tests/HomeRemoteTests/ServerAddressNavigationInteractionTests.swift
      - path: Tests/HomeRemoteTests/PlexHomeOnboardingInteractionTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Plozz.InteractionTests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PlozziOSPresentationHost
    dependencies:
      - target: PlozziOSPresentationHost

schemes:
  PlozziOSInteractionTests:
    build:
      targets:
        PlozziOSPresentationHost: all
        PlozziOSInteractionTests: [test]
    test:
      config: Debug
      targets:
        - PlozziOSInteractionTests

  PlozziOSPresentationTests:
    build:
      targets:
        PlozziOSPresentationHost: all
        PlozziOSPresentationTests: [test]
    test:
      config: Debug
      targets:
        - PlozziOSPresentationTests

  PlozziOS:
    build:
      targets:
        PlozziOS: all
    run:
      config: Debug
